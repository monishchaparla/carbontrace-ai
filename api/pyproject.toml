[project]
name = "carbontrace"
version = "0.1.0"
description = "Audit-ready Scope 1-3 carbon accounting engine"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.3",
  "openpyxl>=3.1",
  "pint>=0.24",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
